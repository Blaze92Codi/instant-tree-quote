<html>
<head>
<title>TreeVision AI - Instant Tree Quote</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="max-w-md mx-auto bg-white rounded-3xl shadow-xl overflow-hidden">
    <div class="p-8">
      <h1 class="text-3xl font-bold text-center text-emerald-700 mb-2">TreeVision AI</h1>
      <p class="text-center text-gray-600 mb-8">Snap a photo of your tree — get instant quote in seconds</p>
      
      <div id="upload-area" class="border-2 border-dashed border-emerald-300 rounded-2xl p-8 text-center cursor-pointer hover:border-emerald-500 transition-colors">
        <input type="file" id="file-input" accept="image/*" class="hidden">
        <div class="space-y-4">
          <div class="mx-auto w-16 h-16 bg-emerald-100 rounded-2xl flex items-center justify-center text-4xl">🌳</div>
          <p class="font-medium">Upload or take a photo of your tree</p>
          <p class="text-sm text-gray-500">Takes under 20 seconds</p>
        </div>
      </div>

      <div id="result" class="hidden mt-8">
        <!-- Results populated by JS -->
      </div>
    </div>
  </div>

  <script>
    // Simple demo - in real version this calls AI vision
    const uploadArea = document.getElementById('upload-area');
    const fileInput = document.getElementById('file-input');
    const resultDiv = document.getElementById('result');

    uploadArea.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      uploadArea.classList.add('hidden');
      
      resultDiv.classList.remove('hidden');
      resultDiv.innerHTML = `
        <div class="text-center">
          <p class="text-emerald-600 font-medium mb-4">Analyzing your tree...</p>
          <div class="animate-pulse">Processing photo</div>
        </div>
      `;

      // Simulate AI processing
      setTimeout(() => {
        resultDiv.innerHTML = `
          <div class="bg-emerald-50 rounded-2xl p-6">
            <h2 class="font-semibold text-xl mb-4">📍 Your Tree Analysis</h2>
            <p><strong>Species:</strong> Red Oak</p>
            <p><strong>Recommended:</strong> Crown thinning + deadwood removal</p>
            <p class="text-2xl font-bold text-emerald-700 mt-6">$875 – $1,250</p>
            <button onclick="window.location.reload()" class="mt-8 w-full bg-emerald-700 text-white py-4 rounded-2xl font-medium">Book Professional Visit</button>
          </div>
        `;
      }, 1800);
    });
  </script>
</body>
</html>
